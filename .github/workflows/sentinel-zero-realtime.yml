name: Sentinel Zero Realtime

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  create:
  delete:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sentinel:
    name: sentinel-realtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Analyze repository event
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          EVENT_PATH: ${{ github.event_path }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          event_path = os.environ["EVENT_PATH"]
          event_name = os.environ["EVENT_NAME"]
          repo = os.environ["REPOSITORY"]
          actor = os.environ["ACTOR"]
          ref_name = os.environ.get("REF_NAME", "")
          token = os.environ["GH_TOKEN"]

          with open(event_path, "r", encoding="utf-8") as f:
              event = json.load(f)

          changed = set()
          notes = []

          if event_name == "push":
              for commit in event.get("commits", []):
                  for key in ("added", "modified", "removed"):
                      changed.update(commit.get(key, []) or [])

          elif event_name == "pull_request":
              number = event["pull_request"]["number"]
              page = 1
              while True:
                  url = f"https://api.github.com/repos/{repo}/pulls/{number}/files?per_page=100&page={page}"
                  req = urllib.request.Request(
                      url,
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      batch = json.load(resp)
                  if not batch:
                      break
                  changed.update(item["filename"] for item in batch)
                  if len(batch) < 100:
                      break
                  page += 1

          elif event_name in ("create", "delete"):
              notes.append(f"{event_name.upper()} ref_type={event.get('ref_type')} ref={event.get('ref')}")

          score = 0
          reasons = []

          rules = [
              (lambda p: p.startswith(".github/workflows/"), 5, "workflow/CI changed"),
              (lambda p: p in {"package.json", "yarn.lock", "package-lock.json", "pnpm-lock.yaml"}, 3, "dependency surface changed"),
              (lambda p: p == "SECURITY.md" or p.startswith("security/"), 3, "security policy/IR changed"),
              (lambda p: p == ".gitignore", 2, "ignore policy changed"),
              (lambda p: p.startswith(("01_premissas/","03_regulatorio/","07_riscos/","08_data_room_index/")), 2, "governance/data-room structure changed"),
          ]

          for path in sorted(changed):
              for predicate, weight, reason in rules:
                  if predicate(path):
                      score += weight
                      reasons.append(f"{path}: {reason}")

          if event_name in ("create", "delete"):
              score += 3
              reasons.extend(notes)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = [
              "# SENTINELA ZERO — realtime event",
              f"- Event: `{event_name}`",
              f"- Actor: `{actor}`",
              f"- Ref: `{ref_name}`",
              f"- Risk score: **{score}**",
              f"- Changed paths observed: **{len(changed)}**",
          ]
          if reasons:
              lines.append("## Triggers")
              lines.extend(f"- {r}" for r in reasons[:50])
          else:
              lines.append("- No high-risk path trigger observed.")

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")

          print("\n".join(lines))

          if score >= 3:
              print("::warning title=SENTINELA ZERO::High-sensitivity repository change detected")
              raise SystemExit(1)
          PY

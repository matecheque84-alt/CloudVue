name: NORTE Governance Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, submitted_review, dismissed_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    name: norte-governance
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate auditable PR metadata and GitHub review state
        env:
          EVENT_JSON: ${{ toJSON(github.event) }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          e=json.loads(os.environ["EVENT_JSON"])
          pr=e["pull_request"]
          body=pr.get("body") or ""
          sha=pr["head"]["sha"]
          number=pr["number"]
          author=(pr.get("user") or {}).get("login","")
          required=["Change ID:","Mission ID:","Operational author","Risk:","Evidence refs:","Authorization result:","Policy version:","Independent reviewer:","Red Team required:","Decision:"]
          errors=[]
          missing=[x for x in required if x not in body]
          if missing: errors.append("missing audit fields: "+", ".join(missing))
          m=re.search(r"Head SHA:\s*([0-9a-fA-F]{40})",body)
          if not m: errors.append("Head SHA must contain a full 40-character commit SHA")
          elif m.group(1).lower()!=sha.lower(): errors.append("recorded Head SHA does not equal PR head SHA")
          risk=re.search(r"Risk:\s*(LOW|MEDIUM|HIGH|CRITICAL)",body,re.I)
          red=re.search(r"Red Team required:\s*(yes|no)",body,re.I)
          decision=re.search(r"Decision:\s*(PROMOTE|HOLD|REJECT|SUPERSEDE)",body,re.I)
          auth=re.search(r"Authorization result:\s*(ALLOW|DENY|CONCEALED_DENY|QUERY_FAILED)",body,re.I)
          if not risk: errors.append("Risk must be explicit")
          if not red: errors.append("Red Team requirement must be explicit")
          if not decision: errors.append("Decision must be explicit")
          if not auth: errors.append("Authorization result must be explicit")
          if risk and risk.group(1).upper() in {"HIGH","CRITICAL"} and (not red or red.group(1).lower()!="yes"):
              errors.append("HIGH/CRITICAL requires Red Team review")
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/pulls/{number}/reviews",
              headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req) as resp: reviews=json.load(resp)
          latest={}
          for review in reviews:
              login=(review.get("user") or {}).get("login","")
              if login: latest[login]=review
          approvals=[r for login,r in latest.items() if login!=author and r.get("state")=="APPROVED" and r.get("commit_id")==sha]
          if not approvals: errors.append("exact current head SHA requires an APPROVED GitHub review from an identity other than the PR author")
          if decision and decision.group(1).upper()!="PROMOTE": errors.append("merge gate requires Decision: PROMOTE")
          if auth and auth.group(1).upper()!="ALLOW": errors.append("merge gate requires Authorization result: ALLOW")
          if errors:
              for x in errors: print("::error::"+x)
              raise SystemExit(1)
          print("NORTE metadata, exact SHA, authorization and independent GitHub review validated.")
          PY
